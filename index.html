<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veldwerk</title>
<meta name="theme-color" content="#F6F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1B19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veldwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F6F2EC;--card:#FFFDF9;--ink:#2B2724;--muted:#6F665E;--line:#E7DFD5;--line2:#D9CFC3;--accent:#C4532B;--onaccent:#FFFFFF;--soft:#FBE7DD;--softink:#9A3412;--chip:#F0E9E1;--ok:#2E7D4F;--danger:#B3261E;--r:14px}
:root[data-theme=dark]{--bg:#1D1B19;--card:#272421;--ink:#F1ECE6;--muted:#A59B90;--line:#3A3530;--line2:#5A534C;--accent:#E8875F;--onaccent:#1D1B19;--soft:#3A2A22;--softink:#F2A27F;--chip:#332F2B;--ok:#3E9A63;--danger:#F2817A}
@media (prefers-color-scheme: dark){:root[data-theme=auto]{--bg:#1D1B19;--card:#272421;--ink:#F1ECE6;--muted:#A59B90;--line:#3A3530;--line2:#5A534C;--accent:#E8875F;--onaccent:#1D1B19;--soft:#3A2A22;--softink:#F2A27F;--chip:#332F2B;--ok:#3E9A63;--danger:#F2817A}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{margin:0;font-size:22px;font-weight:800;line-height:1.15}
header.top .sub{font-size:12px;color:var(--muted);font-weight:600}
.hbtns{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink)}
main{padding:0 16px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.card h2 small{color:var(--muted);font-weight:600;font-size:12px}
.sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.row.done .tx{text-decoration:line-through;color:var(--muted)}
.tx{flex:1;min-width:0}
.tx b{font-weight:800}
.tx small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.click{cursor:pointer}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none}
.pill.warn{background:var(--soft);color:var(--softink)}
.pill.ok{background:var(--ok);color:#fff}
.pill.mid{background:var(--chip);color:var(--ink)}
.pill.wo{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vseg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.vseg button{border:0;background:none;font-weight:800;font-size:12px;padding:6px 12px;border-radius:99px;cursor:pointer}
.vseg button.on{background:var(--ink);color:var(--bg)}
.btn{border:0;background:var(--accent);color:var(--onaccent);font-weight:800;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:15px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.dash{background:transparent;border:1.5px dashed var(--line2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.block{width:100%}
.btn.big{min-height:120px;flex-direction:column;font-size:22px;border-radius:18px}
.btn.big small{font-size:14px;font-weight:700;opacity:.9}
.btn[disabled]{opacity:.5}
.mini{border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;cursor:pointer;flex:none;white-space:nowrap}
.mini.sent{color:var(--ok);border-color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick{height:76px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:800;cursor:pointer}
.quick svg{color:var(--accent)}
.active{border:2px solid var(--accent)}
.badge{font-size:12px;font-weight:800;color:var(--onaccent);background:var(--accent);border-radius:99px;padding:3px 10px}
.timer{font-size:40px;font-weight:800;line-height:1}
.notice{font-size:13px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line2);color:var(--muted);margin-bottom:12px;line-height:1.45}
.notice b{color:var(--ink)}
.next{font-size:13px;margin:0 0 12px;padding:9px 11px;background:var(--soft);border-radius:10px}
.ev{display:flex;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:6px;background:var(--chip);border-left:4px solid var(--muted);align-items:center}
.ev.run{background:var(--soft);border-left-color:var(--accent)}
.ev.reis{border-left-style:dashed}
.ev .tm{font-weight:800;font-size:13px;min-width:44px}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps i{display:block;height:8px;border-radius:99px;background:var(--line)}
.steps i.d{background:var(--ink)}
.steps i.n{background:var(--accent)}
.steps span{font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.box{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;flex:none;cursor:pointer;border:2px solid var(--line2);background:transparent;padding:0}
.box.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.box.open{border:2.5px solid var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--line) 0 8px,var(--chip) 8px 16px);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .loc{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:99px}
.thumb .loc.no{background:#B3261E}
.ncards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ncard .ph{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--line) 0 8px,var(--chip) 8px 16px)}
.ncard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ncard .bd{padding:10px;display:flex;flex-direction:column;gap:6px}
.ncard .bd b{font-size:14px;font-weight:800}
.ncard .bd p{margin:0;font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel .c{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 6px 6px 12px;border-radius:99px;background:var(--ink);color:var(--bg)}
.chipsel .c button{width:24px;height:24px;border-radius:99px;border:0;background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chipsel .add{font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;border:1.5px dashed var(--line2);background:transparent;cursor:pointer}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
table.st td{padding:10px 4px;border-bottom:1px dashed var(--line);vertical-align:middle}
table.st tr:last-child td{border-bottom:0}
table.st .r{text-align:right}
table.st .c{text-align:center}
table.st tfoot td{font-weight:800;border-top:1px solid var(--line);border-bottom:0}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.bottom button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;cursor:pointer;flex:1;min-height:48px}
nav.bottom button.on{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));background:var(--accent);color:var(--onaccent);border:0;border-radius:99px;width:58px;height:58px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:11;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:800}
.sheet .lead{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:6px}
.seg button{padding:11px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.l{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.q{font-size:15px;font-weight:800;margin:14px 0 8px}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=datetime-local],input[type=email],input[type=number],select,textarea{width:100%;padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
textarea{resize:vertical;line-height:1.45}
.pair{display:flex;gap:8px}.pair>*{flex:1;min-width:0}
.actions{display:flex;gap:8px;margin-top:16px}
.actions>*{flex:1}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.viewer img{width:100%;border-radius:12px;display:block}
.meta{font-size:12px;color:var(--muted)}
.gap{border:1.5px dashed var(--accent);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;line-height:1.4}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<button class="fab hidden" id="fab" aria-label="Toevoegen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bottom" id="nav" aria-label="Hoofdmenu">
  <button data-nav="vandaag"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Vandaag</button>
  <button data-nav="projecten"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projecten</button>
  <button data-nav="notities"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg>Notities</button>
  <button data-nav="taken"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Taken</button>
  <button data-nav="uren"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Uren</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galIn" accept="image/*" multiple class="hidden">
<input type="file" id="restoreIn" accept=".json,application/json" class="hidden">

<script src="lib.js"></script>
<script>
"use strict";
/* =========================================================
   Veldwerk – werkdag, metingen, veldnotities, taken en uren
   Alle gegevens staan lokaal op dit toestel (IndexedDB).
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const nowISO = () => new Date().toISOString();
const dkey = d => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const hm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const DAYS = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const DAYS_L = ["Zondag", "Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag"];
const MONTHS = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const MONTHS_L = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const dShort = k => { const d = fromKey(k); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const dLong = k => { const d = fromKey(k); return `${DAYS_L[d.getDay()]} ${d.getDate()} ${MONTHS_L[d.getMonth()]}`; };
const dtShort = iso => { const d = new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${hm(iso)}`; };
const dec = mins => (Math.round(mins / 60 * 100) / 100).toFixed(2).replace(".", ",");
const hmDur = mins => { mins = Math.max(0, Math.round(mins)); return `${Math.floor(mins / 60)}:${pad(mins % 60)}`; };
const toLocalInput = iso => { if (!iso) return ""; const d = new Date(iso); return `${dkey(d)}T${hm(iso)}`; };
const fromLocalInput = v => v ? new Date(v).toISOString() : null;
const combine = (k, t) => { const [h, m] = t.split(":").map(Number); const d = fromKey(k); d.setHours(h, m, 0, 0); return d.toISOString(); };
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = d.getUTCFullYear(); const w = Math.ceil(((d - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return { y, w };
}
const mondayOf = d => { d = new Date(d); d.setHours(0, 0, 0, 0); const day = d.getDay() || 7; d.setDate(d.getDate() - day + 1); return d; };
function distM(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtLL = (lat, lng) => `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2400); }

/* ---------- Opslag (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("veldwerk", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("kv"); d.createObjectStore("photos", { keyPath: "id" }); };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode); const s = t.objectStore(store);
      const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(k) { return DB.tx("kv", "readonly", s => s.get(k)); },
  set(k, v) { return DB.tx("kv", "readwrite", s => s.put(v, k)); },
  photoPut(p) { return DB.tx("photos", "readwrite", s => s.put(p)); },
  photoGet(id) { return DB.tx("photos", "readonly", s => s.get(id)); },
  photoDel(id) { return DB.tx("photos", "readwrite", s => s.delete(id)); },
  photoAll() { return DB.tx("photos", "readonly", s => s.getAll()); },
  photoClear() { return DB.tx("photos", "readwrite", s => s.clear()); }
};

const DEFAULT = () => ({
  v: 1,
  projects: [],      // {id,nr,name,indirect,active,locs:[{lat,lng,at}],created}
  segs: [],          // {id,pid,start,end,kind:'werk'|'reis'|'overig',lat,lng}
  travel: null,      // {since, fromPid}
  meas: [],          // {id,name,pids:[],steps:{gemeten,export,verwerkt,verzonden,projectmap},created}
  notes: [],         // {id,title,body,pids:[],mids:[],action,photos:[ids],created,updated}
  tasks: [],         // {id,title,due,done,pid,mid,noteId,tt,created}
  portal: {},        // {dateKey:true}
  ignoredGaps: {},
  settings: { theme: "auto", radius: 150, round: true, ttMail: "" }
});
let S = DEFAULT();
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(() => DB.set("state", S).catch(() => toast("Opslaan mislukt")), 150); }
function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme || "auto";
  const dark = S.settings.theme === "dark" || (S.settings.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);

/* ---------- Model ---------- */
const STEPS = [["gemeten", "Gemeten", "Gemeten"], ["export", "Geëxporteerd", "Export"], ["verwerkt", "Verwerkt in mijn map", "Verwerkt"], ["verzonden", "Verzonden", "Verzonden"], ["projectmap", "In projectmap", "Projectmap"]];
const NEXTLBL = { export: "Niet geëxporteerd", verwerkt: "Te verwerken", verzonden: "Te verzenden", projectmap: "Naar projectmap" };
const P = id => S.projects.find(p => p.id === id);
const M = id => S.meas.find(m => m.id === id);
const N = id => S.notes.find(n => n.id === id);
const T = id => S.tasks.find(t => t.id === id);
const pnr = id => (P(id) || { nr: "?" }).nr;
const pname = id => (P(id) || { name: "" }).name;
const activeProjects = () => S.projects.filter(p => p.active !== false).sort((a, b) => a.nr.localeCompare(b.nr));
const running = () => S.segs.find(s => !s.end);
const segsOn = k => S.segs.filter(s => dkey(s.start) === k).sort((a, b) => a.start.localeCompare(b.start));
function stepsOf(m) { return STEPS; }
const nextStep = m => stepsOf(m).find(([k]) => !m.steps[k]);
function measPill(m) {
  const n = nextStep(m);
  if (!n) return `<span class="pill ok">Klaar</span>`;
  if (n[0] === "gemeten") return `<span class="pill mid">Gepland</span>`;
  return `<span class="pill ${n[0] === "export" ? "warn" : "mid"}">${NEXTLBL[n[0]]}</span>`;
}
function stepsBar(m) {
  const n = nextStep(m);
  return `<div class="steps">${STEPS.map(([k]) => `<i class="${m.steps[k] ? "d" : n && n[0] === k ? "n" : ""}"></i>`).join("")}${STEPS.map(s => `<span>${s[2]}</span>`).join("")}</div>`;
}
const notesOfProject = pid => S.notes.filter(n => n.pids.includes(pid));
const notesOfMeas = mid => S.notes.filter(n => n.mids.includes(mid));
const measOfProject = pid => S.meas.filter(m => m.pids.includes(pid));
function nearestProject(lat, lng) {
  let best = null;
  for (const p of S.projects) {
    if (p.active === false || p.indirect) continue;
    for (const l of p.locs || []) {
      const d = distM({ lat, lng }, l);
      if (!best || d < best.d) best = { p, d };
    }
  }
  return best;
}
const rnd = d => { if (!S.settings.round) return d; const q = 15 * 60000; return new Date(Math.round(d.getTime() / q) * q); };
function segMins(s) { return (new Date(s.end || Date.now()) - new Date(s.start)) / 60000; }
// Dagstaat-regels in het portaal-format: aaneengesloten blokken per werkorder, afgerond op kwartier
function dayLines(k) {
  const lines = [];
  for (const s of segsOn(k)) {
    const a = rnd(new Date(s.start)), b = rnd(new Date(s.end || Date.now()));
    if (b <= a) continue;
    const key = (s.kind === "overig" ? "o|" : "r|") + s.pid;
    const last = lines[lines.length - 1];
    if (last && last.key === key && last.end.getTime() >= a.getTime() - 60000) { if (b > last.end) last.end = b; last.running = last.running || !s.end; }
    else lines.push({ key, pid: s.pid, overig: s.kind === "overig", start: a, end: b, running: !s.end });
  }
  lines.forEach(l => l.mins = (l.end - l.start) / 60000);
  return lines;
}
const lineTimes = l => `${hm(l.start)} - ${hm(l.end)}`;

/* ---------- Locatie ---------- */
function getPos(opts) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("Geen locatie beschikbaar op dit toestel"));
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude }),
      e => rej(new Error(e.code === 1 ? "Geen toestemming voor locatie. Zet locatie aan voor deze app." : "Locatie niet gevonden, probeer opnieuw")),
      Object.assign({ enableHighAccuracy: true, timeout: 20000, maximumAge: 15000 }, opts || {}));
  });
}

async function makeThumb(blob) {
  try {
    const bmp = await createImageBitmap(blob, { imageOrientation: "from-image" });
    const s = 360 / Math.max(bmp.width, bmp.height); const w = Math.round(bmp.width * Math.min(1, s)), h = Math.round(bmp.height * Math.min(1, s));
    const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    return await new Promise(r => c.toBlob(r, "image/jpeg", .78));
  } catch (e) {
    try {
      const url = URL.createObjectURL(blob); const img = new Image(); img.src = url; await img.decode();
      const s = 360 / Math.max(img.naturalWidth, img.naturalHeight); const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * Math.min(1, s)); c.height = Math.round(img.naturalHeight * Math.min(1, s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      return await new Promise(r => c.toBlob(r, "image/jpeg", .78));
    } catch (e2) { return null; }
  }
}
async function handlePhotos(files, source) {
  const ctx = pendingPhotoNote; pendingPhotoNote = null; if (!ctx || !files.length) return;
  toast(files.length > 1 ? `${files.length} foto's verwerken…` : "Foto verwerken…");
  // camera: huidige locatie gebruiken; galerij: eerst EXIF, anders vragen
  const posP = source === "camera" ? getPos({ maximumAge: 10000, timeout: 15000 }).catch(() => null) : Promise.resolve(null);
  let pos = await posP;
  for (const f of files) {
    const u8 = new Uint8Array(await f.arrayBuffer());
    const ex = VWLib.readExif(u8);
    const rec = { id: uid("f"), blob: f.slice(0, f.size, f.type || "image/jpeg"), type: f.type || "image/jpeg", name: f.name || "foto.jpg", taken: ex.taken || (source === "camera" ? nowISO() : new Date(f.lastModified || Date.now()).toISOString()), lat: null, lng: null, acc: null, alt: null, locSource: "none", exifGps: typeof ex.lat === "number" };
    if (typeof ex.lat === "number") { rec.lat = ex.lat; rec.lng = ex.lng; rec.locSource = "exif"; }
    else if (pos) { rec.lat = pos.lat; rec.lng = pos.lng; rec.acc = pos.acc; rec.alt = pos.alt; rec.locSource = "app-gps"; }
    rec.thumb = await makeThumb(rec.blob);
    await DB.photoPut(rec);
    ctx.draft.photos.push(rec.id);
  }
  if (source === "galerij") {
    const missing = [];
    for (const id of ctx.draft.photos) { const p = await DB.photoGet(id); if (p && typeof p.lat !== "number") missing.push(id); }
    if (missing.length) { ctx.draw(); askLocFor(missing, ctx.draw); return; }
  }
  if (source === "camera" && !pos) toast("Foto bewaard, maar locatie niet gevonden");
  ctx.draw();
}

function periodRange(p) {
  const now = new Date(), s = new Date(now); s.setHours(0, 0, 0, 0); const e = new Date(s); e.setDate(e.getDate() + 1);
  if (p === "vandaag") return [s, e];
  if (p === "week") { const m = mondayOf(now); const x = new Date(m); x.setDate(x.getDate() + 7); return [m, x]; }
  if (p === "vorigeweek") { const m = mondayOf(now); m.setDate(m.getDate() - 7); const x = new Date(m); x.setDate(x.getDate() + 7); return [m, x]; }
  if (p === "maand") { const m = new Date(now.getFullYear(), now.getMonth(), 1); return [m, new Date(now.getFullYear(), now.getMonth() + 1, 1)]; }
  if (p && p.startsWith("wk:")) { const m = fromKey(p.slice(3)); const x = new Date(m); x.setDate(x.getDate() + 7); return [m, x]; }
  return [new Date(2000, 0, 1), new Date(2100, 0, 1)];
}

    let photoCount = 0;
    for (const wo of Object.keys(groups).sort()) {
      rep += `<h2>${esc(wo)}</h2>`;
      for (const ms of Object.keys(groups[wo])) {
        rep += `<h3>Meting: ${esc(ms)}</h3>`;
        for (const n of groups[wo][ms]) {
          rep += `<div class="n"><b>${esc(n.title)}</b> <span class="m">${dtShort(n.created)}${n.action ? " · actiepunt" + (n.actionDone ? " (afgehandeld)" : "") : ""}</span>${n.body ? `<div class="b">${esc(n.body)}</div>` : ""}<div class="g">`;
          let i = 0;
          for (const pid of n.photos) {
            const p = await DB.photoGet(pid); if (!p) continue; i++; photoCount++;
            const ext = (p.type.split("/")[1] || "jpg").replace("jpeg", "jpg").replace("heic", "heic");
            const fname = `${fnSafe(n.pids[0] ? pnr(n.pids[0]) : "los")}_${stamp(p.taken)}_${fnSafe(n.title).slice(0, 30)}_${i}.${ext}`;
            const path = `Fotos/${fnSafe(wo)}/${fnSafe(ms)}/${fname}`;
            files.push({ path, data: await photoWithGps(p), date: new Date(p.taken) });
            meta.push([path, n.title, wo, ms, p.taken, p.lat ?? "", p.lng ?? "", p.acc ? Math.round(p.acc) : "", p.locSource]);
            rep += `<div><img src="${esc(path)}" alt=""><br>${hm(p.taken)} ${typeof p.lat === "number" ? fmtLL(p.lat, p.lng) : "geen locatie"}</div>`;
          }
          rep += `</div></div>`;
        }
      }
    }
    rep += `</body></html>`;
    files.push({ path: "Veldrapport.html", data: rep });
    if (photoCount) files.push({ path: "Fotos/fotolijst.csv", data: "﻿" + meta.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\r\n") });
  }
  let blob, name;
  if (files.length === 1 && files[0].path.endsWith(".xlsx")) { blob = files[0].data; name = files[0].path; }
  else { const z = new VWLib.Zip(); files.forEach(f => z.add(f.path, f.data, f.date)); blob = await z.blob(); name = `Veldwerk_${label}_${stamp(nowISO())}.zip`; }
  deliver(blob, name);
}
function deliver(blob, name) {
  const file = new File([blob], name, { type: blob.type || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  openSheet(`<h3>Export klaar</h3><p class="lead">${esc(name)} · ${(blob.size / 1048576).toFixed(1)} MB</p>
    <div class="actions" style="flex-direction:column"><a class="btn" href="${url}" download="${esc(name)}" id="dlA">${I.share} Downloaden</a>${canShare ? `<button class="btn ghost" id="shB">Delen (mail, Drive, WhatsApp…)</button>` : ""}<button class="btn ghost" data-act="close">Sluit</button></div>`, () => {
    if ($("#shB")) $("#shB").onclick = async () => { try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e.name !== "AbortError") toast("Delen lukt niet, gebruik Downloaden"); } };
    $("#dlA").onclick = () => setTimeout(() => toast("Download gestart"), 300);
  });
}

/* ---------- Back-up ---------- */
const b64 = async blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
const unb64 = (s, type) => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };
async function backup() {
  toast("Back-up maken…");
  const photos = await DB.photoAll();
  const out = { app: "veldwerk", v: 1, made: nowISO(), state: S, photos: [] };
  for (const p of photos) { const { blob, thumb, ...rest } = p; out.photos.push(Object.assign(rest, { data: await b64(blob) })); }
  deliver(new Blob([JSON.stringify(out)], { type: "application/json" }), `Veldwerk_backup_${stamp(nowISO())}.json`);
}
async function restore(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "veldwerk" || !data.state) throw new Error("Geen Veldwerk-back-up");
    openSheet(`<h3>Back-up terugzetten?</h3><p class="lead">Back-up van ${dtShort(data.made)} met ${data.photos.length} foto's. Alles wat nu in de app staat wordt vervangen.</p>
      <div class="actions"><button class="btn ghost" data-act="close">Annuleer</button><button class="btn danger" id="rY">Vervang alles</button></div>`, () => {
      $("#rY").onclick = async () => {
        $("#rY").disabled = true; await DB.photoClear(); urlCache.clear();
        for (const p of data.photos) { const { data: d, ...rest } = p; rest.blob = unb64(d, p.type); rest.thumb = await makeThumb(rest.blob); await DB.photoPut(rest); }
        S = Object.assign(DEFAULT(), data.state); S.settings = Object.assign(DEFAULT().settings, data.state.settings || {});
        await DB.set("state", S); applyTheme(); closeSheet(); toast("Back-up teruggezet"); back.length = 0; go("vandaag", null, false);
      };
    });
  } catch (e) { toast("Terugzetten mislukt: " + e.message); }
}
$("#restoreIn").addEventListener("change", e => { const f = e.target.files[0]; if (f) restore(f); });

/* ---------- Instellingen ---------- */
async function settingsSheet() {
  let est = "";
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); est = `${(e.usage / 1048576).toFixed(1)} MB in gebruik`; } } catch (e) { }
  let persisted = false; try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false; } catch (e) { }
  const st = S.settings;
  openSheet(`<h3>Instellingen</h3>
    <label class="l">Weergave</label><div class="seg" style="--n:3" id="sTh">${[["auto", "Automatisch"], ["light", "Licht"], ["dark", "Donker"]].map(([v, l]) => `<button data-v="${v}" class="${st.theme === v ? "on" : ""}">${l}</button>`).join("")}</div>
    <label class="l" for="sR">Locatie herkennen binnen (meter)</label><input type="number" id="sR" min="20" max="2000" step="10" value="${st.radius}">
    <label class="check" style="margin-top:8px"><input type="checkbox" id="sRd" ${st.round ? "checked" : ""}> Dagstaat afronden op kwartieren</label>
    <label class="l" for="sTT">TickTick-mailadres (optioneel)</label><input type="email" id="sTT" value="${esc(st.ttMail)}" placeholder="todo+xxxx@mail.ticktick.com">
    <div class="q">Gegevens</div>
    <div class="meta" style="margin-bottom:8px">Alles staat alleen op dit toestel. ${esc(est)}${persisted ? " · beschermd tegen opruimen" : ""}. Maak regelmatig een back-up.</div>
    <div class="grid2"><button class="btn ghost" id="sBk">Back-up maken</button><button class="btn ghost" id="sRs">Back-up terugzetten</button></div>
    <div class="actions"><button class="btn" id="sOk">Opslaan</button></div>
    <div class="meta" style="margin-top:14px;text-align:center">Veldwerk v1.0</div>`, () => {
    let theme = st.theme;
    $$("#sTh button").forEach(b => b.onclick = () => { theme = b.dataset.v; $$("#sTh button").forEach(x => x.classList.toggle("on", x === b)); S.settings.theme = theme; applyTheme(); });
    $("#sBk").onclick = backup;
    $("#sRs").onclick = () => { $("#restoreIn").value = ""; $("#restoreIn").click(); };
    $("#sOk").onclick = () => { S.settings = Object.assign(st, { theme, radius: Math.max(20, +$("#sR").value || 150), round: $("#sRd").checked, ttMail: $("#sTT").value.trim() }); applyTheme(); save(); closeSheet(); render(); };
  });
}

/* =================== Klikafhandeling =================== */
document.addEventListener("click", e => {
  const nv = e.target.closest("[data-nav-go]"); if (nv) { back.length = 0; view = { name: nv.dataset.navGo }; render(); return; }
  const tabEl = e.target.closest("[data-pt],[data-mf],[data-ptab],[data-nf],[data-tf],[data-um]");
  if (tabEl && !e.target.closest("#sheet")) {
    const d = tabEl.dataset;
    if (d.pt) ui.projTab = d.pt; if (d.mf) ui.measFilter = d.mf; if (d.ptab) view.tab = d.ptab; if (d.nf) ui.noteFilter = d.nf; if (d.tf) ui.taskFilter = d.tf; if (d.um) ui.urenMode = d.um;
    render(); return;
  }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const d = a.dataset, act = d.act;
  const H = {
    back: goBack, close: closeSheet, settings: settingsSheet, export: () => exportSheet(view.name === "project" ? { pid: view.id } : {}),
    pin: doPin, laptop: laptopSheet, switch: switchSheet, depart: departSheet,
    stoptravel: () => { S.travel = null; save(); render(); toast("Reistijd gestopt"); },
    newnote: () => { const r = running(); const m = d.mid ? M(d.mid) : null; noteSheet(newNote({ pids: d.pid ? [d.pid] : m ? [...m.pids] : r ? [r.pid] : [], mids: m ? [m.id] : [] })); },
    newphoto: () => { const r = running(); const n = newNote({ pids: r ? [r.pid] : [] }); noteSheet(n); const c = $("#nCam"); if (c) c.click(); },
    newmeas: () => measNewSheet(d.pid),
    gomeas: () => { ui.projTab = "metingen"; ui.measFilter = d.f || "open"; back.length = 0; go("projecten", null, false); },
    openproj: () => go("project", { id: d.id }), editproj: () => projectSheet(P(d.id)),
    openmeas: () => go("meting", { id: d.id }),
    stepnow: () => { const m = M(view.id); m.steps[d.k] = nowISO(); save(); render(); toast("Bijgewerkt"); },
    steptoggle: () => { const m = M(view.id); m.steps[d.k] = m.steps[d.k] ? null : nowISO(); save(); render(); },
    workon: () => { const m = M(view.id); const at = nowISO(); stopRunning(at); S.travel = null; startSeg(m.pids[0], at, "werk"); save(); toast("Uren lopen op " + pnr(m.pids[0])); back.length = 0; go("vandaag", null, false); },
    unlinkmp: () => { const m = M(view.id); m.pids = m.pids.filter(x => x !== d.id); save(); render(); },
    linkmp: () => { const m = M(view.id); pickSheet("Koppel werkorder", activeProjects().filter(p => !m.pids.includes(p.id)).map(p => ({ id: p.id, t: p.nr, s: p.name })), id => { m.pids.push(id); save(); closeSheet(); render(); }, "Geen andere actieve werkorders."); },
    unlinkmn: () => { const n = N(d.id); n.mids = n.mids.filter(x => x !== view.id); save(); render(); },
    linkmn: () => { const m = M(view.id); const ns = S.notes.filter(n => !n.mids.includes(m.id)).sort((x, y) => (m.pids.some(p => y.pids.includes(p)) - m.pids.some(p => x.pids.includes(p))) || y.created.localeCompare(x.created)); pickSheet("Koppel notitie", ns.map(n => ({ id: n.id, t: n.title, s: n.pids.map(pnr).join(" + ") + " · " + dtShort(n.created) })), id => { N(id).mids.push(m.id); save(); closeSheet(); render(); }, "Geen andere notities."); },
    actiondone: () => { const n = N(d.id); n.actionDone = a.checked; const t = S.tasks.find(x => x.noteId === n.id); if (t) { t.done = a.checked; t.doneAt = a.checked ? nowISO() : null; } save(); render(); },
    renamemeas: () => { const m = M(view.id); openSheet(`<h3>Naam meting</h3><input type="text" id="rnN" value="${esc(m.name)}"><div class="actions"><button class="btn ghost" data-act="close">Annuleer</button><button class="btn" id="rnOk">Opslaan</button></div>`, () => $("#rnOk").onclick = () => { const v = $("#rnN").value.trim(); if (v) { m.name = v; save(); } closeSheet(); render(); }); },
    delmeas: () => { const m = M(view.id); confirmSheet(`meting “${m.name}”`, () => { S.meas = S.meas.filter(x => x !== m); S.notes.forEach(n => n.mids = n.mids.filter(x => x !== m.id)); S.tasks.forEach(t => { if (t.mid === m.id) t.mid = ""; }); save(); closeSheet(); goBack(); }, "Gekoppelde notities blijven bestaan."); },
    opennote: () => noteSheet(N(d.id)),
    viewphoto: () => photoViewer(d.id),
    taskdone: () => { const t = T(d.id); t.done = a.checked; t.doneAt = a.checked ? nowISO() : null; if (t.noteId && N(t.noteId)) N(t.noteId).actionDone = a.checked; save(); setTimeout(render, 250); },
    opentask: () => taskSheet(T(d.id)),
    tt: () => { const t = T(d.id); if (!S.settings.ttMail) return; const body = [t.due ? "Datum: " + t.due : "", t.pid ? "Werkorder: " + pnr(t.pid) : ""].filter(Boolean).join("\n"); location.href = `mailto:${encodeURIComponent(S.settings.ttMail)}?subject=${encodeURIComponent(t.title)}&body=${encodeURIComponent(body)}`; t.tt = true; save(); setTimeout(render, 500); },
    editday: () => go("dagbewerken", { k: d.k }), editseg: () => segSheet(S.segs.find(s => s.id === d.id)), addseg: () => segSheet(null, d.k),
    gapfill: () => { S.segs.push({ id: uid("s"), pid: d.pid, start: d.a, end: d.b, kind: "reis" }); save(); render(); toast("Reistijd geboekt"); },
    gapignore: () => { S.ignoredGaps[d.key] = true; save(); render(); },
    gouren: () => { ui.urenMode = "dag"; ui.urenDay = d.k; back.length = 0; view = { name: "uren" }; render(); window.scrollTo(0, 0); },
    unav: () => {
      const n = +d.d;
      if (ui.urenMode === "dag") { if (!n) ui.urenDay = dkey(new Date()); else { const x = fromKey(ui.urenDay); x.setDate(x.getDate() + n); ui.urenDay = dkey(x); } }
      else { if (!n) ui.weekRef = dkey(new Date()); else { const x = fromKey(ui.weekRef); x.setDate(x.getDate() + 7 * n); ui.weekRef = dkey(x); } }
      render();
    },
    copyline: async () => { const l = dayLines(ui.urenDay)[+d.i]; await copyText(`${pnr(l.pid)}\t${dec(l.mins)}\t${lineTimes(l)}`, "Regel gekopieerd"); },
    copyday: async () => { const ls = dayLines(ui.urenDay); if (!ls.length) return toast("Geen uren"); await copyText(`Dagstaat ${dShort(ui.urenDay)}\n` + ls.map(l => `${pnr(l.pid)}${pname(l.pid) ? " " + pname(l.pid) : ""}\t${dec(l.mins)}\t${lineTimes(l)}`).join("\n") + `\nTotaal\t${dec(ls.reduce((x, l) => x + l.mins, 0))}`, "Dagstaat gekopieerd"); },
    portal: () => { S.portal[d.k] = a.checked; if (!a.checked) delete S.portal[d.k]; save(); },
    portalw: () => { e.stopPropagation(); if (S.portal[d.k]) delete S.portal[d.k]; else S.portal[d.k] = true; save(); render(); },
    exportweek: () => { const mon = mondayOf(fromKey(ui.weekRef)); const cur = mondayOf(new Date()); const diff = Math.round((cur - mon) / 6048e5); exportSheet({ only: "uren", range: diff === 0 ? "week" : diff === 1 ? "vorigeweek" : "wk:" + dkey(mon) }); }
  };
  if (act === "portalw") { e.stopPropagation(); }
  if (H[act]) { if (act !== "taskdone" && act !== "actiondone" && act !== "portal") e.preventDefault(); H[act](); }
}, true);
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); toast(msg); }
  catch (e) { openSheet(`<h3>Kopiëren</h3><p class="lead">Selecteer en kopieer de tekst.</p><textarea rows="8" id="cpT">${esc(t)}</textarea><div class="actions"><button class="btn" data-act="close">Klaar</button></div>`, () => { $("#cpT").select(); }); }
}

/* =================== Start =================== */
(async function init() {
  try { await DB.open(); const st = await DB.get("state"); if (st) { S = Object.assign(DEFAULT(), st); S.settings = Object.assign(DEFAULT().settings, st.settings || {}); } }
  catch (e) { toast("Opslag niet beschikbaar – gegevens worden niet bewaard"); }
  window.VW_READY = true;
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  render();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && view.name === "vandaag") render(); });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => { });
})();
</script>
